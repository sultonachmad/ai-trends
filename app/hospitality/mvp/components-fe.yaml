schemaVersion: 1
layouts:
- name: RootLayout
  path: frontend/app/layout.tsx
  description: Root layout with Inter font, dark mode support
- name: AuthenticatedLayout
  path: frontend/app/(authenticated)/layout.tsx
  description: Authenticated layout with RBAC guard and dynamic navigation
components:
- name: Nav
  path: frontend/components/Nav.tsx
  description: Top navigation bar with responsive menu
- SessionProvider
- AuthGuard
- LogoutButton
- LoginForm
- Sidebar
- name: RbacGuard
  path: frontend/components/RbacGuard.tsx
  description: Permission-based route guard — hides or redirects when user lacks required permission
- name: DynamicNav
  path: frontend/components/DynamicNav.tsx
  description: Whole app nav frame (aside or top bar) with menu items based on user permissions; do not
    mount it beside the layout Sidebar or Nav
- RbacProvider
- GoogleSSOForm
- MicrosoftSSOForm
- name: Dialog
  path: frontend/components/Dialog.tsx
  description: Modal dialog — dimmed overlay + opaque panel (bg-card). Use for all modals, confirmations
    and detail panels so nothing shows through.
- DataTable
- EntityForm
- DeleteConfirm
- UploadZone
- FileList
- name: LanguageSwitch
  path: frontend/components/LanguageSwitch.tsx
  description: Bahasa Indonesia / English toggle for staff screens
- name: ConversationList
  path: frontend/components/inbox/ConversationList.tsx
  description: 'Inbox list rows: guest, preview, time, unread badge'
- name: MessageThread
  path: frontend/components/inbox/MessageThread.tsx
  description: Chat bubbles with day separators and sent/failed markers
- name: ReplyBox
  path: frontend/components/inbox/ReplyBox.tsx
  description: Reply textarea (Enter sends); shows why replying is blocked
- name: SimulatorPanel
  path: frontend/components/inbox/SimulatorPanel.tsx
  description: Dev-only form to send a message in as a guest
- name: CreateLinkDialog
  path: frontend/components/payments/CreateLinkDialog.tsx
  description: New payment link form (amount, purpose, DP total, validity); optional conversationId sends
    it in chat
- name: LinkCreatedNotice
  path: frontend/components/payments/LinkCreatedNotice.tsx
  description: 'Shown once after creation: sent/not-sent reason and the address to copy'
- name: PaymentLinkTable
  path: frontend/components/payments/PaymentLinkTable.tsx
  description: Links table with state badge, time left / paid via, cancel action
- name: PaymentInstructions
  path: frontend/components/payments/PaymentInstructions.tsx
  description: 'Guest instructions: simulated QRIS box or virtual account number with copy'
- name: ManualTransferPanel
  path: frontend/components/payments/ManualTransferPanel.tsx
  description: 'Pay page: bank details, copy number, proof upload with consent, checking/rejected states'
- name: ProofList
  path: frontend/components/proofs/ProofList.tsx
  description: Transfer proofs with state badge and review/view action
- name: ProofReviewDialog
  path: frontend/components/proofs/ProofReviewDialog.tsx
  description: Image, expected amount, duplicate warning; approve or reject with reason
- name: ProofUploadDialog
  path: frontend/components/proofs/ProofUploadDialog.tsx
  description: Staff record a proof for a link, or for a transfer without a link (amount + purpose)
- name: ProofImage
  path: frontend/components/proofs/ProofImage.tsx
  description: Loads a proof image with the session and shows it from an object URL
- name: LinkQuotaNotice
  path: frontend/components/payments/LinkQuotaNotice.tsx
  description: This month's payment links against the plan limit, with bar; warning and limit-reached styles
- name: RoomTypeDialog / RatePlanDialog
  path: frontend/components/rooms/RoomTypeDialog.tsx, RatePlanDialog.tsx
  description: Create and edit forms for room types (incl. unit names) and rate plans (terms, price per room)
- name: RoomTypeList / RatePlanList
  path: frontend/components/rooms/RoomLists.tsx
  description: Lists with edit and switch on/off actions
- name: RoomsCard
  path: frontend/components/rooms/RoomsCard.tsx
  description: Dashboard card leading to room set-up, then to the calendar
- name: CalendarGrid
  path: frontend/components/calendar/CalendarGrid.tsx
  description: One table per room type (availability, price row per rate plan, minimum stay); cells are buttons
- name: CalendarChangeDialog
  path: frontend/components/calendar/CalendarChangeDialog.tsx
  description: One change for a date range, weekdays and room types; used for a single cell and for bulk changes
- name: BookingTermsSection
  path: frontend/components/settings/BookingTermsSection.tsx
  description: Deposit share for direct bookings (owner edits)
pages:
- name: HomePage
  path: frontend/app/page.tsx
  layout: RootLayout
  description: Landing page
- LoginPage
- DashboardPage
- name: AdminRedirectPage
  path: frontend/app/(authenticated)/admin/page.tsx
  layout: AuthenticatedLayout
  description: Admin section landing - redirects to users management
- name: AdminUsersPage
  path: frontend/app/(authenticated)/admin/users/page.tsx
  layout: AuthenticatedLayout
  description: User list with role assignment
- name: AdminRolesPage
  path: frontend/app/(authenticated)/admin/roles/page.tsx
  layout: AuthenticatedLayout
  description: Role list with permission count
- name: AdminRoleDetailPage
  path: frontend/app/(authenticated)/admin/roles/[id]/page.tsx
  layout: AuthenticatedLayout
  description: Role detail - edit name, assign/remove permissions
- name: AdminPermissionsPage
  path: frontend/app/(authenticated)/admin/permissions/page.tsx
  layout: AuthenticatedLayout
  description: Permission list (read-only, seeded from rbac-spec.yaml)
- SampleContactPage
- name: OnboardingPage
  path: frontend/app/(authenticated)/onboarding/page.tsx
  layout: AuthenticatedLayout
  description: 'Create the workspace: property name, type, city; redirects to /dashboard when one exists'
- name: WorkspaceDashboardPage
  path: frontend/app/(authenticated)/dashboard/page.tsx
  layout: AuthenticatedLayout
  description: 'Workspace home: property, Free plan usage, empty inbox and payment-link states; redirects
    to /onboarding when no workspace'
- name: InboxPage
  path: frontend/app/(authenticated)/inbox/page.tsx
  layout: AuthenticatedLayout
  description: Two-pane inbox (list + thread), ?c=<conversation id>, timed re-fetch
- name: PaymentLinksPage
  path: frontend/app/(authenticated)/payment-links/page.tsx
  layout: AuthenticatedLayout
  description: Staff list of payment links with state tabs, create and cancel; timed re-fetch
- name: PayPage
  path: frontend/app/pay/[token]/page.tsx
  layout: RootLayout
  description: 'PUBLIC guest pay page (no sign-in, no sidebar): choose QRIS / virtual account, instructions,
    auto-updating state'
- name: TransferProofsPage
  path: frontend/app/(authenticated)/transfer-proofs/page.tsx
  layout: AuthenticatedLayout
  description: Review queue with state tabs, record proof, timed re-fetch
- name: SettingsPage
  path: frontend/app/(authenticated)/settings/page.tsx
  layout: AuthenticatedLayout
  description: Bank account for manual transfers (owner edits)
- name: RoomsPage
  path: frontend/app/(authenticated)/rooms/page.tsx
  layout: AuthenticatedLayout
  description: Rooms & rates — room types and rate plans
- name: CalendarPage
  path: frontend/app/(authenticated)/calendar/page.tsx
  layout: AuthenticatedLayout
  description: Calendar with a 14-day (7 on a phone) window, navigation, single-cell and bulk changes
hooks:
- name: useRbac
  path: frontend/lib/rbac-store.tsx
  description: React context hook — exposes user, roles, permissions, hasPermission(), menus
- name: useLocale
  path: frontend/lib/locale-store.ts
  description: Current UI language, setLocale() and t(key, vars); remembered per browser
- name: usePolling
  path: frontend/lib/use-polling.ts
  description: Run an async task now and on an interval while the tab is visible; no overlap
utilities:
- name: RbacProvider
  path: frontend/lib/rbac-store.tsx
  description: Context provider that fetches /api/me on mount and caches RBAC state
- rbac-store
- require_permission
- seed_rbac
- api-client
- upload-client
- audit_service
- audit_erasure
- name: i18n
  path: frontend/lib/i18n.ts
  description: translate(locale, key, vars) with id/en dictionaries; add every new UI string here
- name: workspace-api
  path: frontend/lib/workspace-api.ts
  description: fetchOnboardingStatus, createWorkspace, fetchWorkspace
- name: request
  path: frontend/lib/api-client.ts
  description: Shared fetch helper (session cookie, ApiError) for non-CRUD endpoints
- name: inbox-api
  path: frontend/lib/inbox-api.ts
  description: fetchConversations, fetchConversation, fetchMessages, sendReply, markRead, resolve/reopenConversation,
    simulateInbound
- name: inbox-format
  path: frontend/lib/inbox-format.ts
  description: applyFirstPage, mergeConversations, mergeMessages, formatListTime, formatClock, dayLabel,
    startsNewDay
- name: money
  path: frontend/lib/money.ts
  description: formatRupiah, parseRupiah (whole rupiah only)
- name: payment-link-format
  path: frontend/lib/payment-link-format.ts
  description: stateLabelKey, stateBadgeClass, timeLeft, timeLeftKey
- name: payment-links-api
  path: frontend/lib/payment-links-api.ts
  description: fetchPaymentLinks, createPaymentLink, cancelPaymentLink
- name: checkout-api
  path: frontend/lib/checkout-api.ts
  description: 'Public: fetchPublicLink, startPayment, simulatePayment'
- name: transfer-proofs-api
  path: frontend/lib/transfer-proofs-api.ts
  description: fetchProofs, uploadStaffProof, fetchProofImage, approveProof, rejectProof
- name: settings-api
  path: frontend/lib/settings-api.ts
  description: fetchBankAccount, saveBankAccount
- name: proof-format
  path: frontend/lib/proof-format.ts
  description: proofFileProblem (type/size), bankFormProblem, proofStateKey, proofBadgeClass, PROOF_ACCEPT_ATTRIBUTE
- name: send / requestBlob
  path: frontend/lib/api-client.ts
  description: send (FormData or JSON body), requestBlob (binary download with the session)
- name: link-quota
  path: frontend/lib/link-quota.ts
  description: quotaState, isBlocked, quotaPercent, resetDateLabel, quotaTextKey
- name: rooms-api / rate-plans-api / calendar-api
  path: frontend/lib/rooms-api.ts, rate-plans-api.ts, calendar-api.ts
  description: Typed calls for room types, rate plans and the calendar (fetchCalendar, changeCalendar)
- name: calendar-grid
  path: frontend/lib/calendar-grid.ts
  description: Date maths on YYYY-MM-DD strings, weekday names, cellState, rangeProblem, compactRupiah, todayIn
- name: room-forms
  path: frontend/lib/room-forms.ts
  description: checkRoomType, checkRatePlan, parseWhole, numberSetting
api_routes:
- api/auth/[...nextauth]
