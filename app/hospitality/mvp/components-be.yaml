api_routers:
- prefix: /api/health
  file: backend/app/main.py
  description: Health check endpoint
- prefix: /api/sample-items
  file: backend/app/routers/sample_items.py
  description: CRUD endpoints for SampleItem (list, get, create, update, delete)
- session_router
- sample_protected_router
- prefix: /api/rbac
  file: backend/app/rbac/router.py
  description: RBAC admin endpoints — roles CRUD, permissions list, user-role assignment
- prefix: /api/me
  file: backend/app/rbac/me.py
  description: Current user profile — returns user info, roles, permissions, allowed menus
- rbac_router
- me_router
- auth
- oauth_bridge
- upload
- extract
- contact_router
- audit_router
services: []
middleware:
- session
patterns:
- name: create_crud_router
  file: backend/app/crud/router_factory.py
  description: Factory that wires list/get/create/patch/delete for any BaseEntity subclass
- name: require_permission
  file: backend/app/rbac/dependencies.py
  description: FastAPI dependency — raises 403 if current user lacks the required permission code
- crud-router-factory
utilities_backend:
- name: BaseEntity
  file: backend/app/crud/base_model.py
  description: Auto-increment id + TimestampMixin (created_at, updated_at, created_by, updated_by)
- name: utc_datetime_field
  file: backend/app/crud/base_model.py
  description: Helper to declare timezone-aware TIMESTAMP WITH TIME ZONE columns
- name: seed_rbac
  file: backend/app/rbac/seed.py
  description: Startup task — seeds permissions from rbac-spec.yaml, creates default admin role and user
- extractor
- name: TenantEntity
  file: backend/app/crud/base_model.py
  description: 'Tenant-DB base: UUID id + tenant_id + audit columns with DB defaults'
- name: TenantRecord
  file: backend/app/crud/base_model.py
  description: Tenant-DB base without audit columns (ledgers, logs, high-volume rows)
- name: UUIDEntity
  file: backend/app/crud/base_model.py
  description: 'Control-plane base: UUID id + audit columns with DB defaults'
- name: ServerAuditMixin
  file: backend/app/crud/base_model.py
  description: created_at/updated_at/created_by/updated_by with DB defaults (now())
- name: MIGRATION_ONLY
  file: backend/app/crud/base_model.py
  description: '__table_args__ marker: table DDL lives only in Alembic; startup create_all skips it'
- name: startup_tables
  file: backend/app/database.py
  description: Tables create_db_and_tables() may build (excludes migration-only tables)
