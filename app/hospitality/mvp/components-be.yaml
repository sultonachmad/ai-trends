  file: backend/app/routers/payment_links.py
  description: 'Staff: create (and send to a conversation), list (state, limit, cursor), read, cancel'
- prefix: /api/pay
  file: backend/app/routers/checkout.py
  description: 'PUBLIC pay page: GET /{token}, POST /{token}/payments — the link token is the credential'
- prefix: /api/simulator/payments
  file: backend/app/routers/simulator.py
  description: POST /{token}/pay — dev-only simulated payment; 404 unless PREFAB_PAYMENT_SIMULATOR_ENABLED
- prefix: /api/transfer-proofs
  file: backend/app/routers/transfer_proofs.py
  description: 'Staff: list (state, cursor), read, upload (multipart), image, approve, reject'
- prefix: /api/settings
  file: backend/app/routers/settings.py
  description: GET/PUT /bank-account for manual transfers (PUT owner only)
- prefix: /api/pay/{token}/proofs
  file: backend/app/routers/checkout.py
  description: 'PUBLIC: guest uploads a transfer screenshot (multipart file + consent)'
- prefix: /api/room-types
  file: backend/app/routers/rooms.py
  description: 'Room types: list, create, PATCH (name, kind, units, guests, on/off), rename one unit'
- prefix: /api/rate-plans
  file: backend/app/routers/rate_plans.py
  description: 'Rate plans: list, create, PATCH (name, meal, cancellation terms, base prices, on/off)'
- prefix: /api/calendar
  file: backend/app/routers/calendar.py
  description: GET ?from=&to= (availability, closed, min stay, prices); POST /changes (one change to a date
    range, weekdays and room types)
- prefix: /api/settings/booking-terms
  file: backend/app/routers/settings.py
  description: Deposit share for direct bookings (PUT owner only)
- prefix: /api/bookings
  file: backend/app/routers/bookings.py
  description: 'Staff: quote, create, list (tab, q, cursor), read, PATCH, cancel, record/remove a payment'
