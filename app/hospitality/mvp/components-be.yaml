  description: Current user profile — returns user info, roles, permissions, allowed menus
- rbac_router
- me_router
- auth
- oauth_bridge
- upload
- extract
- contact_router
- audit_router
- prefix: /api/onboarding
  file: backend/app/routers/onboarding.py
  description: GET /status, POST — a signed-in account creates its workspace (tenant + property on the
    Free plan)
- prefix: /api/workspace
  file: backend/app/routers/workspace.py
  description: GET — the caller's property, plan, monthly payment-link usage and business settings
- prefix: /api/conversations
  file: backend/app/routers/inbox.py
  description: 'Inbox: list (status, limit, cursor), read, messages (?after=), reply, read, resolve, reopen;
    plus GET /api/inbox/summary'
